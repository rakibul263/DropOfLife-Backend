services:
  - type: web
    name: dropoflife-backend
    env: node
    region: singapore # Closest region to Bangladesh/South-East Asia
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5050
      - key: CLIENT_URL
        sync: false # Set to your Vercel frontend URL, e.g. https://dropoflife.vercel.app
      - key: DATABASE_URL
        sync: false # Neon PostgreSQL URL
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ARCJET_KEY
        sync: false
